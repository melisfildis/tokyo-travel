        let aktifGunIndeksi = 0;
        let yemekRehberiGosteriliyor = false;

        // 1. Sol Menüyü Oluştur
        function menuyuCiz() {
            const menuKapsayici = document.getElementById('menu-kapsayici');
            menuKapsayici.innerHTML = '';

            // Gün butonları
            itineraryData.forEach((veri, indeks) => {
                const aktifMi = (indeks === aktifGunIndeksi && !yemekRehberiGosteriliyor);
                const buton = document.createElement('button');

                // Temiz sınıf isimlendirmeleri
                buton.className = `menu-butonu ${aktifMi ? 'aktif' : ''}`;
                buton.innerHTML = `
                    <span class="gun-etiket">Gün ${veri.day}</span>
                    <span class="gun-tarih">${veri.date.split(',')[0]}</span>
                `;

                buton.onclick = () => {
                    yemekRehberiGosteriliyor = false;
                    aktifGunIndeksi = indeks;
                    menuyuCiz();
                    gorunumleriGuncelle();
                    gunlukPlaniCiz();
                };

                menuKapsayici.appendChild(buton);
            });

            // Ayracı (Çizgi) ekle
            const ayrac = document.createElement('div');
            ayrac.style.borderTop = "1px solid var(--renk-kenarlik)";
            ayrac.style.margin = "8px 0";
            menuKapsayici.appendChild(ayrac);

            // Yemek Rehberi Butonu
            const yemekButonu = document.createElement('button');
            yemekButonu.className = `menu-butonu yemek-butonu ${yemekRehberiGosteriliyor ? 'aktif' : ''}`;
            yemekButonu.innerHTML = `🍽️ Yemek Rehberi`;

            yemekButonu.onclick = () => {
                yemekRehberiGosteriliyor = true;
                menuyuCiz();
                gorunumleriGuncelle();
                yemekRehberiniCiz();
            };

            menuKapsayici.appendChild(yemekButonu);
        }

        // 2. Ekran Değişimlerini Yönet
        function gorunumleriGuncelle() {
            const planAlani = document.getElementById('gunluk-plan-alani');
            const yemekAlani = document.getElementById('yemek-rehberi-alani');

            if (yemekRehberiGosteriliyor) {
                planAlani.classList.add('gizli');
                yemekAlani.classList.remove('gizli');
            } else {
                yemekAlani.classList.add('gizli');
                planAlani.classList.remove('gizli');
            }
        }

                        <div>
                            <div class="yemek-isim">${oge.name}</div>
                            <div class="yemek-tur">${oge.type}</div>
                        </div>
                        <div class="yemek-fiyat">${oge.price}</div>
                    </div>
                `).join('');

                kapsayici.innerHTML += `
                    <div class="yemek-kategori">
                        <div class="yemek-kategori-baslik">${bolge}</div>
                        <div class="yemek-listesi">
                            ${listeHTML}
                        </div>
                    </div>
                `;
            }
        }

        // 4. Günlük Plan İçeriğini Oluştur
        function gunlukPlaniCiz() {
            const kapsayici = document.getElementById('gunluk-plan-alani');
            const gunVerisi = itineraryData[aktifGunIndeksi];

            let duraklarHTML = '';
            gunVerisi.stops.forEach(durak => {
                duraklarHTML += `
                    <div class="durak-karti">
                        <div class="durak-ikonu">${durak.icon}</div>
                        <div style="display: flex; align-items: center; margin-bottom: 4px;">
                            <span class="durak-zaman">${durak.time}</span>
                            <h3 class="durak-baslik">${durak.title}</h3>
                        </div>
                        <p class="durak-kategori">${durak.category}</p>
                        <p class="durak-detay">${durak.desc}</p>
                    </div>
                `;
            });

            kapsayici.innerHTML = `
                <div>
                    <h2 class="gun-baslik">${gunVerisi.title}</h2>
                    <p class="gun-aciklama">${gunVerisi.intro}</p>
                    <a href="${gunVerisi.mapUrl}" target="_blank" class="harita-butonu">
                        📍 Günün Rotasını Google Maps'te Aç
                    </a>
                </div>
                
                <div class="zaman-cizelgesi">
                    ${duraklarHTML}
                </div>
            `;
        }

        // Başlangıç Kurulumu
        menuyuCiz();
        gunlukPlaniCiz();

    </script>
</body>

</html>
