                btn.innerHTML = `<span class="block text-[11px] font-bold uppercase tracking-wider ${isActive ? 'text-indigo-200' : 'text-slate-400'} mb-0.5">Gün ${data.day}</span><span class="block truncate">${data.date.split(',')[0]}</span>`;
                btn.onclick = () => {
                    showingFoodGuide = false;
                    currentDayIndex = index;
                    renderNavigation();
                    toggleViews();
                    renderDayContent();
                };
                navContainer.appendChild(btn);
            });

            // Add Divider
            const divider = document.createElement('div');
            divider.className = "w-px h-8 md:w-full md:h-px bg-slate-200 my-1 mx-2 flex-shrink-0";
            navContainer.appendChild(divider);

            // Render Food Guide Button
            const foodBtn = document.createElement('button');
            foodBtn.className = `w-full text-left px-4 py-3 rounded-xl font-bold transition-all duration-200 whitespace-nowrap md:whitespace-normal flex-shrink-0 md:flex-shrink border ${showingFoodGuide ? 'bg-orange-500 text-white shadow-md border-orange-600 scale-[1.02]' : 'bg-orange-50 text-orange-700 hover:bg-orange-100 border-orange-200 hover:border-orange-300'}`;
            foodBtn.innerHTML = `🍽️ Yemek Rehberi`;
            foodBtn.onclick = () => {
                showingFoodGuide = true;
                renderNavigation();
                toggleViews();
                renderFoodGuide();
            };
            navContainer.appendChild(foodBtn);
        }

        function toggleViews() {
            const dayContent = document.getElementById('day-content');
            const foodGuide = document.getElementById('food-guide');

            if (showingFoodGuide) {
                dayContent.classList.add('hidden');
                foodGuide.classList.remove('hidden');
            } else {
                foodGuide.classList.add('hidden');
                dayContent.classList.remove('hidden');
            }
        }

        function renderFoodGuide() {
            const container = document.getElementById('food-categories-container');
            container.innerHTML = '';

            for (const [region, items] of Object.entries(foodData)) {
                let itemsHtml = items.map(item => `
                <div class="flex flex-col sm:flex-row sm:items-center justify-between p-3 hover:bg-slate-50 rounded-lg border border-transparent hover:border-slate-100 transition-colors">
                    <div>
                        <p class="font-bold text-slate-800">${item.name}</p>
                        <p class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mt-0.5">${item.type}</p>
                    </div>
                    <div class="flex items-center gap-3 mt-2 sm:mt-0">
                        <span class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-1 rounded border border-emerald-100">${item.price}</span>
                    </div>
                </div>
            `).join('');

                container.innerHTML += `
                <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                    <div class="bg-slate-50 px-4 py-3 border-b border-slate-200">
                        <h3 class="text-lg font-bold text-slate-800">${region}</h3>
                    </div>
                    <div class="p-2 divide-y divide-slate-100">
                        ${itemsHtml}
                    </div>
                </div>
            `;
            }
        }

        function renderDayContent() {
            const contentContainer = document.getElementById('day-content');
            const data = itineraryData[currentDayIndex];

            let stopsHtml = '';
            data.stops.forEach((stop, idx) => {
                const isLast = idx === data.stops.length - 1;
                stopsHtml += `
                <div class="relative pl-12 py-5 stop-card ${!isLast ? 'border-b border-slate-100' : ''}">
                    <div class="absolute left-0 top-6 w-9 h-9 ${stop.category.includes('Alışveriş') || stop.category.includes('Mağaza') || stop.category.includes('Ayakkabı') || stop.category.includes('Giyim') || stop.category.includes('Kamera') ? 'bg-amber-100 text-amber-700' : stop.category.includes('Tapınak') || stop.category.includes('Bahçe') ? 'bg-emerald-100 text-emerald-700' : 'bg-indigo-100 text-indigo-700'} rounded-full flex items-center justify-center font-bold text-base z-10 ring-4 ring-white shadow-sm">
                        ${stop.icon}
                    </div>
                    <div class="flex flex-col sm:flex-row sm:items-center mb-1.5 gap-2">
                        <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2.5 py-1 rounded-md tracking-wide w-fit">${stop.time}</span>
                        <h3 class="text-lg font-bold text-slate-800">${stop.title}</h3>
                    </div>
                    <p class="text-xs font-semibold text-indigo-600 uppercase tracking-wider mb-2">${stop.category}</p>
                    <p class="text-slate-600 text-sm leading-relaxed">${stop.desc}</p>
                </div>
            `;
            });

            contentContainer.innerHTML = `
            <div class="mb-6">
                <h2 class="text-2xl md:text-3xl font-extrabold text-slate-800 mb-3">${data.title}</h2>
                <p class="text-slate-600 text-sm md:text-base leading-relaxed p-4 bg-slate-50 rounded-xl border border-slate-200 mb-4">${data.intro}</p>
                <a href="${data.mapUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 px-5 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors duration-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd" />
                    </svg>
                    Günün Rotasını Google Maps'te Aç
                </a>
            </div>
            
            <div class="relative mt-6 pt-2 border-t border-slate-100">
                <div class="timeline-line"></div>
                ${stopsHtml}
            </div>
        `;
        }

        // Initialize
        renderNavigation();
        renderDayContent();

    </script>
</body>

</html>
